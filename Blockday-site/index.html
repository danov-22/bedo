<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>bedo</title>
    <meta name="theme-color" content="#2c8170" />
    <meta name="description" content="bedo is a private, personal time-blocking planner with flexible themes and shareable schedules." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="bedo" />
    <meta property="og:description" content="Plan in minutes, make it yours, and share only what you choose." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://b-do.vercel.app/" />
    <link rel="canonical" href="https://b-do.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="bedo" />
    <meta name="twitter:description" content="Plan in minutes, make it yours, and share only what you choose." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(registrations => registrations.forEach(registration => registration.unregister()));
      if ("caches" in window) caches.keys().then(keys => Promise.all(keys.filter(key => key.startsWith("blockday-")).map(key => caches.delete(key))));
    </script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script defer src="auth-config.js"></script>
    <script defer src="blockday-auth.js"></script>
    <script defer src="blockday-sync.js"></script>
    <script defer src="blockday-app.js"></script>
    <link rel="stylesheet" href="blockday-app.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
